name: Feature request
description: Propose a native Linux improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What native Linux limitation or workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream relationship
      description: Is this already implemented or discussed in Awakened PoE Trade?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This preserves existing application logic unless a change is explicitly requested.
          required: true
        - label: I searched existing native and upstream issues.
          required: true
